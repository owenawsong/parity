<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parity · Design preview</title><link rel="stylesheet" href="studio.css"></head>
<body><div class="app"><aside><div class="brand"><span class="mark" aria-hidden="true">∿</span>Parity</div><nav aria-label="Pages"><button data-page="Overview" class="selected"><i data-icon="buds"></i>Overview</button><button data-page="Sound"><i data-icon="sound"></i>Sound</button><button data-page="Controls"><i data-icon="stem"></i>Controls</button></nav><footer><small>Design preview</small><button id="near"><i data-icon="near"></i>Try nearby popup</button><button id="theme"><i data-icon="sun"></i><span>Light appearance</span></button></footer></aside>
<main><header><span>My devices</span><b> / </b>AirPods Pro 3</header>
<section id="Overview"><div class="title"><h1>AirPods Pro</h1><button id="link" class="subtle">Disconnect</button></div>
<div id="hardware" class="stage"><div id="objects"></div><video id="transition" muted playsinline hidden></video><div id="offline" hidden>Disconnected</div></div>
<div class="group"><h2>Listening mode</h2><div id="modes"></div><div id="adaptive"><label for="adapt">Adaptive Audio</label><div class="stepcontrol"><span>Less noise</span><input id="adapt" type="range" min="0" max="2" value="1" aria-label="Adaptive Audio"><span>More noise</span></div></div></div>
<h2>Sound settings</h2><div class="rows"><button class="row" data-go="Sound"><i data-icon="sound"></i><span>Equalizer</span><small id="eqSummary">Device default</small><em>›</em></button><button class="row" data-switch="conversation" role="switch" aria-checked="false"><i data-icon="conversation"></i><span>Conversation Awareness</span><u></u></button></div></section>
<section id="Sound" hidden><div class="title"><h1>Sound</h1></div><h2>Equalizer</h2><div class="eqcard"><div class="eqhead"><div class="seg"><button id="defaultEQ">Device default</button><button id="customEQ">Custom</button></div><button id="reset" class="subtle">Reset</button></div>
<div class="faderbank" id="bands"></div><div class="audition"><button id="audition" class="subtle"><i data-icon="play"></i><span>Play sound sample</span></button><small>Browser audio</small></div></div>
<h2>Listening preferences</h2><div class="rows"><button class="row" data-switch="volume" role="switch" aria-checked="false"><i data-icon="volume"></i><span>Personalized Volume</span><u></u></button><button class="row" data-switch="conversation" role="switch" aria-checked="false"><i data-icon="conversation"></i><span>Conversation Awareness</span><u></u></button></div></section>
<section id="Controls" hidden><div class="title"><h1>Controls</h1></div><h2>Press and hold</h2><div class="rows" id="stems"></div><h2>Playback</h2><div class="rows"><button class="row" role="switch" data-switch="ear" aria-checked="true"><i data-icon="buds"></i><span>Automatic Ear Detection</span><u></u></button><button class="row" role="switch" data-switch="sleep" aria-checked="false"><i data-icon="moon"></i><span>Pause when falling asleep</span><u></u></button></div></section>
</main></div><dialog id="popup"><h3>AirPods Pro</h3><video id="spin" src="media/loop-charged.webm" poster="media/loop-charged.webp" loop muted playsinline></video><div id="popupBatt"></div><button class="primary" id="connect">Connect</button><button id="dismiss">Not now</button></dialog><script src="studio.js" type="module"></script></body></html>
