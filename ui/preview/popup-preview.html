<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parity · Nearby popup preview</title>
  <style>
    :root {
      color-scheme: dark;
      --edge: #484a54;
      --bg: #161821;
      --surface: #21232c;
      --text: #f1f2f5;
      --secondary: #b9bac6;
      --button: #2e5da7;
      --on-button: #fff;
      font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --edge: #c4c9d4;
      --bg: #e4e9f1;
      --surface: #f4f6fa;
      --text: #242630;
      --secondary: #555965;
      --button: #2458a7;
    }
    * { box-sizing: border-box }
    body { margin: 0; color: var(--text); background: var(--bg); min-height: 100vh; padding: 24px }
    section { max-width: 335px; border: 1px solid var(--edge); border-radius: 12px; background: var(--surface); padding: 16px }
    h1 { font-size: 17px; margin: 0 }
    p { color: var(--secondary); margin: 4px 0 14px }
    button, select { min-height: 36px; border-radius: 7px; font: inherit; padding: 5px 10px }
    button { border: 0; background: var(--button); color: var(--on-button); cursor: pointer }
    button:disabled { opacity: .55; cursor: default }
    label { display: flex; align-items: center; gap: 8px; margin-top: 10px }
    select { background: var(--bg); color: inherit; border: 1px solid var(--edge) }
    a { color: inherit; text-underline-offset: .2em }
    #popup {
      position: fixed;
      inset-inline-end: 18px;
      bottom: 18px;
      width: min(320px, calc(100vw - 36px));
      height: 1px;
      max-height: calc(100dvh - 36px);
      border: 0;
      border-radius: 12px;
      pointer-events: none;
      opacity: 0;
      translate: 0 14px;
      box-shadow: 0 12px 38px #0004;
      transition: opacity 185ms ease-in, translate 185ms ease-in;
    }
    #popup[data-open] {
      opacity: 1;
      translate: 0 0;
      transition: opacity 265ms ease-out, translate 265ms ease-out;
      pointer-events: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      #popup, #popup[data-open] { transition: none }
    }
    @media (max-width: 685px) {
      #popup { position: relative; inset: auto; display: block; margin: 16px 0 0 auto }
    }
  </style>
</head>
<body>
  <section aria-labelledby="title">
    <h1 id="title">Nearby popup preview</h1>
    <p>Simulated device data</p>
    <button id="simulate" type="button" disabled>Simulate nearby AirPods</button>
    <label>Model
      <select id="model">
        <option data-art="pro" selected>AirPods Pro 3</option>
        <option data-art="pro">AirPods Pro 2</option>
        <option data-art="pro">AirPods Pro 1</option>
        <option data-art="airpods">AirPods 1</option>
        <option data-art="airpods">AirPods 2</option>
        <option data-art="airpods">AirPods 3</option>
        <option data-art="airpods4">AirPods 4</option>
        <option data-art="airpods4">AirPods 4 (ANC)</option>
        <option data-art="airpods4">AirPods 5</option>
        <option data-art="max">AirPods Max 1</option>
        <option data-art="max">AirPods Max 2</option>
      </select>
    </label>
    <label><input type="checkbox" id="charging"> Case is charging</label>
    <label>Appearance
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
  </section>
  <iframe id="popup" title="Parity nearby popup" sandbox="allow-scripts"></iframe>
  <script>
    const popup = document.getElementById('popup');
    const simulate = document.getElementById('simulate');
    const charging = document.getElementById('charging');
    const model = document.getElementById('model');
    const theme = document.getElementById('theme');
    const send = (message) => popup.contentWindow.postMessage({ latchwavePopup: true, ...message }, '*');
    const sendModel = () => {
      const art = model.selectedOptions[0].dataset.art;
      charging.disabled = art === 'max';
      send({ model: model.value, art, charging: charging.checked });
    };
    popup.addEventListener('load', () => {
      simulate.disabled = false;
      send({ theme: theme.value });
      sendModel();
    });
    simulate.addEventListener('click', () => send({ simulate: true }));
    model.addEventListener('change', sendModel);
    charging.addEventListener('change', () => send({ charging: charging.checked }));
    theme.addEventListener('change', () => {
      document.documentElement.dataset.theme = theme.value;
      send({ theme: theme.value });
    });
    window.addEventListener('message', ({ data, source }) => {
      if (source !== popup.contentWindow || !data?.latchwavePopup) return;
      if (data.closing) popup.removeAttribute('data-open');
      if (!Number.isFinite(data.height)) return;
      popup.style.height = Math.max(1, data.height) + 'px';
      popup.toggleAttribute('data-open', data.height > 0);
    });
    popup.srcdoc = /* FRAME_DOCUMENT */;
  </script>
</body>
</html>
