name: Bug report
description: Report a problem with Parity.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem and what you expected.
    validations:
      required: true
  - type: input
    id: parity-version
    attributes:
      label: Parity version
    validations:
      required: true
  - type: input
    id: airpods
    attributes:
      label: AirPods model and firmware
      placeholder: AirPods Pro 3
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run winver to check.
    validations:
      required: true
  - type: input
    id: bluetooth
    attributes:
      label: Bluetooth adapter and WPods service version
  - type: textarea
    id: details
    attributes:
      label: Screenshots or relevant log excerpts
      description: Parity logs are in %LOCALAPPDATA%\Pairside\Live\logs. Remove device addresses, personal names, and unrelated activity before attaching anything.
