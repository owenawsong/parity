name: Compatibility report
description: Share how Parity works with your AirPods and Bluetooth adapter.
body:
  - type: input
    id: setup
    attributes:
      label: AirPods model, Bluetooth adapter, and Windows build
      description: Include the adapter hardware ID from Device Manager if available.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Parity and Bluetooth service versions
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What did you test?
      description: For example, connect and reconnect, battery readings, listening modes, and the microphone. Share what worked and what failed.
    validations:
      required: true
